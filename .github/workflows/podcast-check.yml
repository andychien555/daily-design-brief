name: Podcast Check

# daily.yml 之外的 podcast 補抓。早報主觸發（台北 08:00）跑得比財經皓角上架
# （09:05–09:16）還早，一定漏掉當天那集；這支在上架後多排幾次把它補回來，
# 並順便抓不定時更新的節目（如股癌）。有新集就轉錄＋摘要並重建頁面。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "podcast run mode（evening 跳過 morning_only 節目；all 全部都跑）"
        type: choice
        options: [evening, all]
        default: evening
  schedule:
    # 早晨補抓：財經皓角「早晨財經速解讀」實測固定 09:05–09:16 上架，晚於 daily.yml
    # 主觸發（台北 08:00）→ 早報一開始沒有當天那集。這幾次在上架後重抓，把 podcast
    # 區塊換成當天的（不定時節目如股癌也一併重抓；morning_only 的 M觀點沿用早上的）。
    #
    # 為何排三次：GitHub 免費排程不保證準時，實測常延遲 30 分~3 小時，甚至整次被
    # drop（2026-07-07、07-09 的 09:45 那次就完全沒跑，當天財經皓角因此漏掉）。
    # podcast_state.json 快取會擋掉重複轉錄，所以多跑幾次幾乎零成本——只有第一次
    # 真正抓到新集時才會花 Whisper/Claude 的錢，後續各次都是命中快取直接重用。
    - cron: "30 2 * * *"    # 台北 10:30 (UTC 02:30)
    - cron: "30 4 * * *"    # 台北 12:30 (UTC 04:30)
    - cron: "10 7 * * *"    # 台北 15:10 (UTC 07:10)
    - cron: "0 14 * * *"    # 台北 22:00 (UTC 14:00)

permissions:
  contents: write

jobs:
  podcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx==0.28.1 anthropic==0.92.0 groq==1.4.0

      - name: Ensure ffmpeg
        run: which ffmpeg || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch podcast briefs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # 排程預設 evening（跳過 morning_only 如 M觀點，只沿用早上的 brief）；
          # 手動 dispatch 可選 all 讓全部節目都跑（測試新節目用）。
          PODCAST_RUN: ${{ github.event.inputs.mode || 'evening' }}
        run: python fetch_podcast.py

      - name: Regenerate HTML
        run: python generate_html.py

      - name: Refresh archived brief shells
        run: python refresh_briefs_shell.py

      - name: Rebuild keyword search index
        run: python build_search_index.py

      - name: Commit and push (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html archive.json search-index.json data.json briefs/
          [ -f podcast_state.json ] && git add podcast_state.json || true
          [ -f usage_log.json ] && git add usage_log.json || true
          git diff --staged --quiet || git commit -m "chore: podcast check $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          git push
