name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "archive.html"
      - "archive.json"
      - "search-index.json"
      - "assets/**"
      - "briefs/**"

  workflow_run:
    workflows: ["Daily Design Brief", "Backfill Translations", "Podcast Check"]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publishing the repo root also served the pipeline's state files —
      # usage_log.json (daily API spend), podcast_state.json (~340KB of stored
      # summaries), article_state.json. None of them are fetched by the site.
      # Copy out only what the pages actually load.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html favicon.svg archive.json search-index.json _site/
          cp -r assets briefs _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
