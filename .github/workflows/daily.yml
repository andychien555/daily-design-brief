name: Daily Design Brief

on:
  # 主觸發：外部 Vercel Cron 每天台北 08:00 (UTC 00:00) 透過 workflow_dispatch
  workflow_dispatch:
  # 備援：GitHub 內建 schedule，台北 10:00 (UTC 02:00)。
  # 若 Vercel Cron 已在 00:00 跑過，下方 dedup step 會偵測 data.json 已是今天
  # 且 event=schedule → 自動 skip，不會重複產生。
  # schedule 可能延遲數分鐘~數小時，但可避免 Vercel 單點故障時連續多天空白。
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx==0.28.1 anthropic==0.92.0 groq==1.4.0

      - name: Ensure ffmpeg (for podcast audio → Whisper segmentation)
        run: which ffmpeg || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check if already ran today
        id: dedup
        run: |
          TODAY=$(TZ=Asia/Taipei date +%Y-%m-%d)
          EXISTING=$(python3 -c "import json; print(json.load(open('data.json')).get('date',''))" 2>/dev/null || echo "")
          # 當天已產出、且這是備援 schedule 觸發 → 不重跑推文／PH（full=false），
          # 但仍重抓 podcast：財經皓角約 09:07 才上架，08:00 主觸發抓不到當天集，
          # 這個台北 10:00 的備援可補上。此時 podcast_state.json 通常已被 09:45 的
          # podcast-check 快取，故重用不重轉錄，只在頁面尚未更新時才真的補抓。
          if [ "$TODAY" = "$EXISTING" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Already generated for $TODAY — podcast-only refresh"
            echo "full=false" >> $GITHUB_OUTPUT
          else
            echo "full=true" >> $GITHUB_OUTPUT
          fi

      # Starts today's data.json. fetch_tweets.py used to do this on its way past
      # — it was the only script that replaced the file instead of merging one
      # key into it — so without this step the fetchers below would merge today's
      # sections into the last tweet-era file and every issue would carry that
      # day's date.
      #
      # Gated on full, like the fetchers it clears the way for. On a podcast-only
      # refresh the file is already stamped today (that is what dedup just
      # matched on) and 好文/PH are skipped, so wiping it here would republish the
      # 10:00 issue with the morning's articles and launches deleted.
      - name: Initialise today's brief
        if: steps.dedup.outputs.full == 'true'
        run: python init_brief.py

      # X ingestion is paused. Nothing was deleted — fetch_tweets.py still works
      # and the renderers still draw a 推文 section whenever data.json has one.
      # To resume, uncomment this step; it must stay above the fetchers below,
      # because it writes the whole file rather than merging into it.
      #
      # - name: Fetch tweets
      #   if: steps.dedup.outputs.full == 'true'
      #   env:
      #     TWITTER_TOKEN: ${{ secrets.TWITTER_TOKEN }}
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: python fetch_tweets.py

      - name: Fetch Product Hunt launches
        if: steps.dedup.outputs.full == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRODUCTHUNT_API_TOKEN: ${{ secrets.PRODUCTHUNT_API_TOKEN }}
        run: python fetch_producthunt.py

      # podcast 一律重抓（full 與 podcast-only 兩種情況都跑），才能補上當天早上的財經集
      - name: Fetch podcast financial brief
        continue-on-error: true   # 失敗不可中斷整批早報
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python fetch_podcast.py

      # 好文 / Newsletter（Nielsen、Import AI、NN/g、Design with AI、YC 週報）—
      # 每天檢查一次即可，只在完整產出時抓
      - name: Fetch newsletter articles
        if: steps.dedup.outputs.full == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_articles.py

      - name: Generate index.html and daily brief
        run: python generate_html.py

      # Paused with the tweet step above. briefs/*.md holds tweets and nothing
      # else, and is read back only by fetch_tweets.py (summary cache + 2-day
      # dedup) and backfill_translations.py — so with ingestion off it writes a
      # three-line husk into briefs/ every day and nothing ever reads it.
      # Uncomment together with Fetch tweets. Existing .md files stay put; the
      # cache picks them up again on the first restored run.
      #
      # - name: Generate daily markdown
      #   run: python generate_md.py

      # 歷史 brief 不會重新產生，靠這支把最新的 CSS／側欄／搜尋 JS 補回整個存檔
      - name: Refresh archived brief shells
        id: refresh_shell
        # Non-blocking on purpose. This step runs before the commit, so a single
        # stale anchor used to discard the issue that had already been generated
        # and, via deploy.yml's success gate, publish nothing at all that day.
        # With the CSS in one external file a missed page still links styles.css
        # and still gets the current sheet, so the cost is a stale masthead or
        # rail on that page — far less than a day with no issue. The annotation
        # below keeps it visible instead of silent.
        continue-on-error: true
        run: python refresh_briefs_shell.py

      - name: Rebuild keyword search index
        run: python build_search_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # styles.css and 404.html are regenerated by generate_html.py on every run.
          # Both are listed in deploy.yml's push paths; neither was ever staged, so
          # the deploy uploaded a checkout that had the old stylesheet — or none.
          git add index.html 404.html styles.css archive.json search-index.json data.json briefs/
          # podcast_state.json 可能尚未產生（首次 / podcast 步驟失敗）→ 存在才加
          [ -f podcast_state.json ] && git add podcast_state.json || true
          # article_state.json：UX 好文摘要快取，存在才加
          [ -f article_state.json ] && git add article_state.json || true
          # usage_log.json：每日 token/轉錄花費累計，存在才加
          [ -f usage_log.json ] && git add usage_log.json || true
          git diff --staged --quiet || git commit -m "chore: daily brief $(date +'%Y-%m-%d')"
          git push

      - name: Flag a stale archive shell
        if: steps.refresh_shell.outcome == 'failure'
        run: |
          echo "::warning title=Archive shell went stale::refresh_briefs_shell.py \
          could not match an anchor on one or more briefs. The issue still \
          published; those pages keep an old masthead, rail or search box until \
          the regex in refresh_briefs_shell.py is fixed."
