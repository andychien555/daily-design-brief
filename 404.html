  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:    #faf6ed;
      --paper-2:  #f2ebda;
      --paper-3:  #e8dfc9;

      --accent:   #2f4a63;
      --accent-2: #3d5e7c;
      --dawn:     #c08a3e;
      --tint:     rgba(47, 74, 99, .06);
      --hit-bg:   rgba(47, 74, 99, .18);
      --backdrop: rgba(26, 22, 18, .5);
      --grain-opacity: .035;

      /* 明體 carries the whole interface. This overrides the art direction's
         "a single neutral grotesque" rule at the brand owner's direction; mono is
         kept for the machine layer (№, dates, timestamps) because that is a data
         notation rather than a typeface choice, and Ming has no tabular figures. */
      --serif: 'Noto Serif TC', 'Songti TC', 'Source Han Serif TC', 'Georgia', serif;
      --mono:  'JetBrains Mono', ui-monospace, Menlo, monospace;

      /* A broadsheet needs the width. The engraving is generated at 1672px so it
         downscales into this frame rather than being upscaled out of its own
         dither grid — the one asset the brand protects most is never enlarged. */
      --maxw: 1180px;
      --measure: 70ch;
      /* The inset between a desk column's rules and its text. The hover ground
         fills the whole cell, so this is what keeps the tone off the first and

         columns below it share one left edge. */

      --texture: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%208%208%22%20width%3D%228%22%20height%3D%228%22%3E%3Cpath%20d%3D%22M0%200h1v1h-1zM2%200h1v1h-1zM4%200h1v1h-1zM6%200h1v1h-1zM1%201h1v1h-1zM3%201h1v1h-1zM5%201h1v1h-1zM7%201h1v1h-1zM0%202h1v1h-1zM2%202h1v1h-1zM4%202h1v1h-1zM6%202h1v1h-1zM1%203h1v1h-1zM3%203h1v1h-1zM5%203h1v1h-1zM7%203h1v1h-1zM0%204h1v1h-1zM2%204h1v1h-1zM4%204h1v1h-1zM6%204h1v1h-1zM1%205h1v1h-1zM3%205h1v1h-1zM5%205h1v1h-1zM7%205h1v1h-1zM0%206h1v1h-1zM2%206h1v1h-1zM4%206h1v1h-1zM6%206h1v1h-1zM1%207h1v1h-1zM3%207h1v1h-1zM5%207h1v1h-1zM7%207h1v1h-1z%22%2F%3E%3C%2Fsvg%3E");
    }
    [data-theme="dark"] {
      --paper:    #14181e;
      --paper-2:  #1b2028;
      --paper-3:  #232a34;
      --ink:      #ede7da;
      --ink-2:    #c4bcab;
      --ink-3:    #8a8172;
      --rule:     #2a323c;
      --rule-2:   #3a4450;
      --accent:   #8fa9c2;
      --accent-2: #a9bed2;
      --dawn:     #d9a85c;
      --tint:     rgba(143, 169, 194, .08);
      --hit-bg:   rgba(143, 169, 194, .24);
      --backdrop: rgba(6, 8, 11, .62);
      --grain-opacity: .05;
    }
    html { color-scheme: light; transition: background-color .2s; }
    html[data-theme="dark"] { color-scheme: dark; }

    html { font-size: 16px; -webkit-font-smoothing: antialiased; }

    body {
      font-family: var(--serif);
      font-feature-settings: 'ss01', 'cv11';
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.65;
      position: relative;
      overflow-x: hidden;
    }
    /* The paper itself is dithered. A Bayer 8x8 tile, masked rather than blended,
       so the grain is --ink in both themes without needing two source files or a
       blend mode that no-ops against a dark ground. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: var(--grain-opacity);
      background-color: var(--ink);
      -webkit-mask-image: var(--texture);
      mask-image: var(--texture);
      -webkit-mask-size: 8px 8px;
      mask-size: 8px 8px;
    }
    body > * { position: relative; z-index: 1; }

    a { color: inherit; text-decoration: none; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ─────────────── Page shell + Archive rail ─────────────── */
    .page-shell {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      align-items: start;
      transition: grid-template-columns .22s ease;
    }
    .page-main { min-width: 0; }

    .archive-rail {
      position: sticky;
      top: 0;
      max-height: 100vh;
      overflow-y: auto;
      border-right: 1px solid var(--rule);
      padding: 2.25rem 1.25rem 2rem 1.5rem;
      font-size: .78rem;
      transition: padding .22s ease;
    }
    .archive-rail::-webkit-scrollbar { width: 6px; }
    .archive-rail::-webkit-scrollbar-track { background: transparent; }
    .archive-rail::-webkit-scrollbar-thumb { background: var(--rule-2); }

    .rail-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: .58rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 1.1rem;
      gap: .5rem;
    }
    .rail-heading a {
      color: var(--ink-3);
      transition: color .15s;
    }
    .rail-heading a:hover { color: var(--accent); }

    .rail-toggle {
      background: none;
      border: 1px solid var(--rule-2);
      color: var(--ink-3);
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      font-size: .9rem;
      line-height: 1;
      transition: color .15s, border-color .15s;
      flex-shrink: 0;
    }
    .rail-toggle:hover { color: var(--accent); border-color: var(--accent); }
    .rail-toggle-icon {
      display: inline-block;
      transition: transform .22s ease;
      line-height: 1;
    }
    .rail-close-icon {
      display: none;
      line-height: 1;
      font-size: .85rem;
    }

    .rail-drawer-toggle {
      display: none;
      background: none;
      border: 1px solid var(--rule-2);
      color: var(--ink-3);
      width: 32px;
      height: 28px;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      transition: color .15s, border-color .15s;
      flex-shrink: 0;
    }
    .rail-drawer-toggle:hover { color: var(--accent); border-color: var(--accent); }

    .rail-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
      z-index: 49;
    }

    html[data-rail="collapsed"] .page-shell {
      grid-template-columns: 52px minmax(0, 1fr);
    }
    html[data-rail="collapsed"] .archive-rail {
      padding: 2.25rem .5rem 2rem;
    }
    html[data-rail="collapsed"] .rail-heading {
      justify-content: center;
      margin-bottom: 0;
    }
    html[data-rail="collapsed"] .rail-heading-label,
    html[data-rail="collapsed"] .rail-search,
    html[data-rail="collapsed"] .rail-search-status,
    html[data-rail="collapsed"] .rail-list {
      display: none;
    }
    html[data-rail="collapsed"] .rail-toggle-icon {
      transform: rotate(180deg);
    }

    .rail-search {
      display: flex;
      align-items: center;
      gap: .15rem;
      margin-bottom: .9rem;
      border: 1px solid var(--rule-2);
      background: var(--paper-2);
      transition: border-color .15s;
    }
    .rail-search:focus-within { border-color: var(--accent); }
    .rail-search-icon {
      padding-left: .5rem;
      font-size: .95rem;
      line-height: 1;
      color: var(--ink-3);
    }
    .rail-search-input {
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      outline: none;
      color: var(--ink);
      font-family: var(--serif);
      font-size: .72rem;
      padding: .45rem .3rem;
    }
    .rail-search-input::placeholder { color: var(--ink-3); }
    .rail-search-input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }
    .rail-search-clear {
      background: none;
      border: none;
      color: var(--ink-3);
      cursor: pointer;
      font-size: .65rem;
      line-height: 1;
      padding: .35rem .5rem;
      transition: color .15s;
    }
    .rail-search-clear:hover { color: var(--accent); }

    .rail-search-status {
      font-family: var(--mono);
      font-size: .58rem;
      letter-spacing: .1em;
      color: var(--ink-3);
      margin-bottom: .85rem;
    }

    .rail-hit-kind {
      display: inline-block;
      font-family: var(--mono);
      font-size: .54rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-right: .35rem;
      vertical-align: .05em;
    }
    .rail-headline mark {
      background: none;
      color: var(--accent);
      font-weight: 600;
    }
    .rail-item-hit .rail-headline { -webkit-line-clamp: 3; }

    mark.q-hit {
      background: var(--hit-bg);
      color: inherit;
      padding: 0 .08em;
    }
    mark.q-hit-active { outline: 1px solid var(--accent); }

    .rail-list { display: flex; flex-direction: column; }
    .rail-loading {
      padding: .5rem 0;
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .1em;
      color: var(--ink-3);
    }

    .rail-item {
      display: block;
      padding: .7rem 0 .8rem;
      border-top: 1px solid var(--rule);
      opacity: .72;
      transition: opacity .15s;
    }
    .rail-item:first-child { border-top: none; padding-top: 0; }
    .rail-item:hover { opacity: 1; }
    .rail-item-current { opacity: 1; }
    .rail-item-current .rail-headline { color: var(--ink); }
    /* The one place ochre is allowed besides the masthead issue number: this is
       the "today" marker the brand rations it for. */
    .rail-item-current .rail-meta span:first-child { color: var(--dawn); }

    .rail-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: .58rem;
      letter-spacing: .1em;
      color: var(--ink-3);
      margin-bottom: .35rem;
    }

    .rail-headline {
      font-family: var(--serif);
      font-weight: 400;
      font-size: .8rem;
      line-height: 1.45;
      letter-spacing: -.005em;
      color: var(--ink-2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: .3rem;
    }
    .rail-item:hover .rail-headline { color: var(--ink); }

    .rail-date {
      font-family: var(--mono);
      font-size: .58rem;
      color: var(--ink-3);
      letter-spacing: .06em;
    }

    @media (max-width: 980px) {
      .page-shell,
      html[data-rail="collapsed"] .page-shell { grid-template-columns: 1fr; }

      .archive-rail,
      html[data-rail="collapsed"] .archive-rail {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: 280px;
        max-width: 85vw;
        max-height: none;
        z-index: 50;
        background: var(--paper);
        border-right: 1px solid var(--ink);
        border-bottom: none;
        padding: 1.5rem 1.1rem 1.5rem 1.25rem;
        overflow-y: auto;
        transform: translateX(-100%);
        transition: transform .25s ease;
      }
      body.rail-drawer-open .archive-rail {
        transform: translateX(0);
      }

      .rail-backdrop { display: block; }
      body.rail-drawer-open .rail-backdrop {
        opacity: 1;
        pointer-events: auto;
      }
      body.rail-drawer-open { overflow: hidden; }

      .rail-drawer-toggle { display: inline-flex; }

      /* On mobile the rail-toggle becomes a close button */
      .rail-toggle-icon { display: none; }
      .rail-close-icon { display: inline-block; }

      /* Cancel desktop "collapsed" visual state on mobile so the drawer
         always renders fully expanded when opened. */
      html[data-rail="collapsed"] .rail-heading {
        justify-content: space-between;
        margin-bottom: 1.1rem;
      }
      html[data-rail="collapsed"] .rail-heading-label,
      html[data-rail="collapsed"] .rail-list { display: revert; }
      html[data-rail="collapsed"] .rail-search { display: flex; }
      html[data-rail="collapsed"] .rail-search-status { display: revert; }
    }

    /* ─────────────── Masthead — broadsheet nameplate ───────────────
       Engraving full bleed, then a solid ink plate carrying reversed type, then
       the ears. Identical on every issue and every archived page; the numbers in
       the ears are the only thing that changes. Sameness is the ritual. */
    .bs-head { margin-bottom: 2.75rem; }
    .bs-art {
      display: block;
      width: 100%;
      height: clamp(190px, 28vh, 290px);
      object-fit: cover;
      object-position: 50% 42%;
    }
    /* Reversed type on a printed block, not white type floating on a painting.
       The engraving's sky is bone white, so laying type directly on it would need
       a scrim, and a scrim means a gradient. */
    .bs-plate {
      background: var(--ink);
      color: var(--paper);
      max-width: var(--maxw);
      margin: -3.25rem auto 0;
      padding: 1.4rem 2rem 1.2rem;
      position: relative;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .bs-name {
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(2.2rem, 4.6vw, 3.1rem);
      line-height: 1;
      letter-spacing: .14em;
      /* letter-spacing pads the right of the last glyph; pull it back so the two
         characters sit optically placed rather than measurably placed. */
      margin-right: -.14em;
    }
    .bs-plate-meta {
      display: flex;
      gap: 1.5rem;
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      opacity: .8;
    }
    .bs-issue { color: var(--dawn); opacity: 1; }
    /* The front page's own table of contents. */
    .bs-ears {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: .7rem 2rem;
      border-bottom: 2px solid var(--ink);
      display: flex;
      align-items: center;
      gap: 1.6rem;
      font-family: var(--mono);
      font-size: .66rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .bs-ears b { color: var(--ink); font-weight: 500; }
    .bs-ears-rule { flex: 1; height: 1px; background: var(--rule); }

    /* ─────────────── Broadsheet lead ─────────────── */
    .bs-lead { margin-bottom: 3.5rem; }
    .bs-kicker {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    /* The one place this page spends everything: a headline big enough that the
       eye has no choice about where the issue begins. */
    .bs-headline {
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(1.7rem, 3.7vw, 2.7rem);
      line-height: 1.3;
      letter-spacing: -.01em;
      margin-bottom: 1.6rem;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1.5rem;
    }
    .bs-lead-body .yt-brief {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
    }
    /* The kicker is already said louder by .bs-kicker directly above it, and the
       disclosure triangle bought nothing but a 20px indent that pushed the whole
       card out of line with the headline. (The standfirst goes too, but only once
       the lead is open — `details[open] .nl-lead` covers that, and archived pages
       whose lead is still collapsed keep it as their only preview.) */
    .bs-lead-body .yt-kicker,
    .bs-lead-body .yt-toggle { display: none; }
    .bs-lead-body .yt-summary { gap: 0; }
    /* Specificity, not source order: .nl-item .yt-title is defined further down
       and would otherwise win, printing the source headline at list size right
       under a 2.7rem headline that says the same thing. */
    .bs-lead-body .yt-brief .yt-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink-3);
      margin-bottom: .7rem;
    }
    .bs-lead-body .yt-brief .yt-title a { color: var(--ink-3); }
    /* Two columns with a hairline between them — the broadsheet's actual signature. */
    .bs-lead-body .yt-body {
      max-width: none;
      columns: 2;
      column-gap: 2.75rem;
      column-rule: 1px solid var(--rule);
      margin-top: 1.25rem;
    }
    .bs-lead-body .yt-body h3,
    .bs-lead-body .yt-body h4 { break-after: avoid; }
    /* A bullet split across the rule reads as two bullets: the reader takes the
       continuation at the top of the right track for a new item. Paragraphs may
       break — that is what columns do — but a list item may not. */
    .bs-lead-body .yt-body li { break-inside: avoid; }
    .bs-lead-body .yt-body > *:first-child { margin-top: 0; }
    /* A brief with too little text to fill two tracks does not read as columns —
       CSS slices its one paragraph mid-word across the rule and leaves the
       balance to chance. Below the threshold in templates.lead_story it gets one
       track at a normal measure instead. Must stay after the rule above. */
    .bs-lead-compact .yt-body {
      columns: 1;
      column-rule: none;
      max-width: var(--measure);
    }

    /* ─────────────── Body / Layout ─────────────── */
    main {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
      font-family: var(--mono);
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .topbar .sep {
      flex: 1;
      height: 1px;
      background: var(--rule);
    }
    .topbar a,
    .topbar .topbar-link {
      color: var(--accent);
      transition: color .15s;
    }
    .topbar a:hover,
    .topbar .topbar-link:hover { color: var(--accent-2); }
    .topbar .topbar-link {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }
    .theme-toggle {
      background: none;
      border: 1px solid var(--rule-2);
      color: var(--ink-3);
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: .9rem;
      line-height: 1;
      transition: color .15s, border-color .15s, background .15s;
    }
    .theme-toggle:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ─────────────── Criteria Modal ─────────────── */
    .criteria-modal {
      padding: 0;
      margin: auto;
      inset: 0;
      border: 1px solid var(--ink);
      background: var(--paper);
      color: var(--ink-2);
      width: min(640px, calc(100vw - 3rem));
      max-height: calc(100vh - 4rem);
    }
    .criteria-modal::backdrop {
      background: var(--backdrop);
    }
    .criteria-modal[open] {
      animation: modal-in .2s ease;
    }
    @keyframes modal-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
    .criteria-modal-inner {
      padding: 1.75rem 1.9rem 1.9rem;
      max-height: calc(100vh - 4rem);
      overflow-y: auto;
    }
    .criteria-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: .9rem;
      border-bottom: 1px solid var(--rule);
    }
    .criteria-modal-head h3 {
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--ink);
      font-weight: 500;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--ink-3);
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: color .15s;
    }
    .modal-close:hover { color: var(--accent); }
    .criteria-body {
      font-size: .85rem;
      line-height: 1.75;
      color: var(--ink-2);
    }
    .criteria-body p { margin-bottom: .9rem; }
    .criteria-body strong { color: var(--ink); font-weight: 500; }
    .criteria-body ul { padding-left: 1.2rem; margin-bottom: .9rem; }
    .criteria-body li { margin-bottom: .35rem; }
    .criteria-body h4 {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin: 1.6rem 0 .6rem;
      color: var(--ink);
      font-weight: 500;
    }
    .criteria-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: .8rem;
      margin-bottom: .75rem;
    }
    .criteria-body th, .criteria-body td {
      text-align: left;
      padding: .5rem .65rem;
      border-bottom: 1px solid var(--rule);
      vertical-align: top;
    }
    .criteria-body th {
      color: var(--ink-3);
      font-weight: 500;
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-family: var(--mono);
    }
    .criteria-body code {
      background: var(--tint);
      color: var(--accent);
      padding: 1px 7px;
      font-family: var(--mono);
      font-size: .76rem;
    }
    .criteria-note {
      font-size: .76rem;
      color: var(--ink-3);
      margin-top: 1rem;
      padding-top: .75rem;
      border-top: 1px solid var(--rule);
    }

    /* ─────────────── Lead / Hero Card ─────────────── */
    .lead {
      margin-bottom: 3rem;
      border-top: 2px solid var(--ink);
      border-bottom: 1px solid var(--rule);
      padding: 2rem 0 2.25rem;
      position: relative;
    }
    .lead::before {
      content: '';
      position: absolute;
      top: -2px; left: 0;
      width: 80px; height: 2px;
      background: var(--accent);
    }
    /* Same inset as a card's text, so the deck and the two columns under it read
       off one left edge. The lead's own rules stay on the outer grid. */
    .lead-anchor {
      display: block;
      padding-inline: var(--card-pad);
      cursor: pointer;
      transition: opacity .15s;
    }
    .lead-anchor:hover { opacity: .92; }
    .lead-anchor:hover .lead-arrow { transform: translate(3px, -3px); color: var(--accent); }

    .lead-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      font-family: var(--mono);
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .lead-rank {
      color: var(--accent);
      font-weight: 500;
    }
    .lead-rule {
      flex: 1;
      height: 1px;
      background: var(--rule);
    }
    .lead-author {
      display: flex;
      gap: .5rem;
      align-items: baseline;
      text-transform: none;
      letter-spacing: 0;
      font-family: var(--serif);
      font-size: .82rem;
    }
    .lead-author .author-name { color: var(--ink); font-weight: 500; }
    .lead-author .author-handle { color: var(--ink-3); }

    .lead-summary {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.45rem, 3vw, 1.95rem);
      line-height: 1.35;
      letter-spacing: -.02em;
      color: var(--ink);
      margin-bottom: 1rem;
      max-width: var(--measure);
    }
    .lead-text {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--ink-2);
      max-width: var(--measure);
      margin-bottom: 1.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lead-foot {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      font-size: .8rem;
      color: var(--ink-3);
      flex-wrap: wrap;
    }
    .lead-arrow {
      margin-left: auto;
      font-size: 1.2rem;
      color: var(--ink-3);
      transition: transform .2s ease, color .2s;
      display: inline-block;
    }

    /* ─────────────── Section divider ─────────────── */
    .grid-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 0 0 1.5rem;
      font-family: var(--mono);
      font-size: .7rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .grid-divider::before,
    .grid-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    /* ─────────────── The desk — two columns ───────────────
       好文 and 推文 share one grid below the lead. .nl-grid only appears on
       archived pages, which predate the shared grid; it gets the same treatment so
       115 issues read alike. */
    .cards-grid, .nl-grid {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      /* The gutter between the two measures stays 5.5rem: the cells pay
         --card-pad of it each, the track gap pays the rest. */
      column-gap: calc(5.5rem - var(--card-pad) * 2);
      border-top: 1px solid var(--rule);
    }
    .nl-grid { margin-bottom: 3rem; }
    /* The column rule is drawn down the centre of the grid instead of hanging off
       the odd cell's border-right. Hung off the cell it dictated that cell's right
       padding — half a gutter — so a cell could never hold the same inset on both
       sides, and the hover ground that fills the cell was lopsided whichever way
       the gutter was split. Absolutely positioned, so it is not a grid item.
       Rows still stretch, so the bottom rules line up across a pair, and nothing
       inside the grid may span both tracks. */
    .cards-grid::before,
    .nl-grid::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: var(--rule);
      pointer-events: none;
    }

    /* The hover ground is the column cell itself, so it lands on the rules that
       are already there: the grid's top rule, the card's own bottom rule and the
       column rule down the middle. The text carries --card-pad of its own inset
       instead. Bleeding the tone past the cell to keep the text on the outer grid
       was worse than the problem it solved — the tone then agreed with no rule on
       the page and read as a highlight that had slipped sideways. */
    .card {
      border-bottom: 1px solid var(--rule);
      min-width: 0;
      background: transparent;
      transition: background .15s;
    }
    .card:hover { background: var(--paper-2); }
    .card-anchor {
      display: flex;
      flex-direction: column;
      gap: .6rem;
      padding: 1.5rem var(--card-pad) 1.6rem;
      height: 100%;
      cursor: pointer;
      position: relative;
    }
    .card-anchor::after {
      content: '↗';
      position: absolute;
      top: 1.4rem;
      right: var(--card-pad);
      color: var(--ink-3);
      font-size: .95rem;
      transition: transform .2s, color .2s;
    }
    /* Hover moves the arrow and the ground tone only. An inset that shifts the
       padding would slide the text sideways under a pointer that is resting on
       the line someone is reading. */
    .card:hover .card-anchor::after {
      transform: translate(2px, -2px);
      color: var(--accent);
    }

    .card-rank {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .15em;
      color: var(--ink-3);
      margin-bottom: .15rem;
    }
    .card-meta {
      display: flex;
      align-items: baseline;
      gap: .5rem;
      margin-bottom: .25rem;
    }
    .author-name {
      font-size: .85rem;
      font-weight: 500;
      color: var(--ink);
    }
    .author-handle {
      font-size: .72rem;
      color: var(--ink-3);
      font-family: var(--mono);
    }

    .card-summary {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.15rem;
      line-height: 1.45;
      color: var(--ink);
      letter-spacing: -.015em;
      max-width: var(--measure);
    }

    .card-text {
      font-size: .88rem;
      line-height: 1.75;
      color: var(--ink-2);
      flex: 1;
      max-width: var(--measure);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* No rule above the foot: in a single column each card already ends on one,
       and two hairlines a few pixels apart read as noise rather than structure. */
    .card-foot {
      display: flex;
      gap: 1rem;
      align-items: center;
      font-size: .72rem;
      color: var(--ink-3);
      padding-top: .4rem;
      flex-wrap: wrap;
    }

    .stat {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-family: var(--mono);
    }
    .glyph {
      color: var(--ink-3);
      font-size: .8rem;
    }
    .chip {
      margin-left: auto;
      font-family: var(--mono);
      font-size: .62rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-3);
      background: none;
      border: 1px solid var(--rule-2);
      padding: 1px 7px;
    }

    /* ─────────────── Product Hunt Section ─────────────── */
    .ph-divider {
      margin-top: 3.5rem;
    }
    .ph-divider span {
      color: var(--accent);
    }
    .ph-grid {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-top: 1px solid var(--rule);
      margin-bottom: 3rem;
    }
    .ph-card {
      border-bottom: 1px solid var(--rule);
      transition: background .15s;
    }
    .ph-card:hover { background: var(--paper-2); }
    .ph-anchor {
      display: grid;
      grid-template-columns: minmax(200px, 34%) 1fr;
      gap: 0;
      cursor: pointer;
      position: relative;
      min-height: 200px;
    }
    .ph-hero {
      padding: 1.3rem 1.3rem 1.3rem 0;
      display: flex;
    }
    .ph-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border: 1px solid var(--rule);
      /* Product Hunt's CDN links rot; older issues are full of dead ones. The
         background shows through when the image fails, so a missing hero reads as
         a deliberately empty panel instead of a white hole. */
      background: var(--paper-3);
    }
    /* No image: show the paper's own dither rather than a placeholder gradient. */
    .ph-hero-empty {
      background-color: var(--paper-3);
      -webkit-mask-image: var(--texture);
      mask-image: var(--texture);
      -webkit-mask-size: 4px 4px;
      mask-size: 4px 4px;
    }
    .ph-body {
      display: flex;
      flex-direction: column;
      gap: .55rem;
      padding: 1.3rem 0 1.4rem 1.5rem;
      border-left: 1px solid var(--rule);
    }
    .ph-head {
      display: flex;
      align-items: center;
      gap: .85rem;
    }
    .ph-head-text {
      display: flex;
      flex-direction: column;
      gap: .15rem;
      min-width: 0;
    }
    .ph-rank {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .15em;
      color: var(--ink-3);
      text-transform: uppercase;
    }
    .ph-thumb {
      width: 44px;
      height: 44px;
      object-fit: cover;
      background: var(--paper-2);
      border: 1px solid var(--rule);
      flex-shrink: 0;
    }
    @media (max-width: 680px) {
      .ph-anchor {
        grid-template-columns: 1fr;
        min-height: 0;
      }
      .ph-hero {
        aspect-ratio: 16 / 9;
        padding: 1rem 0;
      }
      .ph-body {
        padding: 1.2rem 0 1.3rem;
        border-left: none;
        border-top: 1px solid var(--rule);
      }
    }
    .ph-title {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.2rem;
      line-height: 1.35;
      letter-spacing: -.015em;
      color: var(--ink);
    }
    .ph-tagline {
      font-family: var(--serif);
      font-size: .82rem;
      line-height: 1.6;
      color: var(--ink-3);
    }
    .ph-summary {
      font-size: .88rem;
      line-height: 1.75;
      color: var(--ink-2);
      max-width: var(--measure);
      flex: 1;
    }
    .ph-foot {
      display: flex;
      gap: .75rem;
      align-items: center;
      font-size: .7rem;
      color: var(--ink-3);
      padding-top: .65rem;
      border-top: 1px solid var(--rule);
      flex-wrap: wrap;
    }
    .ph-author {
      font-family: var(--mono);
      letter-spacing: .04em;
    }
    .chip-ph {
      margin-left: 0;
    }
    .ph-arrow {
      margin-left: auto;
      font-size: 1rem;
      color: var(--ink-3);
      transition: transform .2s, color .2s;
    }
    .ph-card:hover .ph-arrow {
      transform: translate(2px, -2px);
      color: var(--accent);
    }

    /* ─────────────── Empty state ───────────────
       An empty day is published empty. The mark, a flat sentence, nothing else —
       no apology, no filler, no substitute content. */
    .empty {
      text-align: center;
      padding: 4.5rem 1rem 4rem;
      border-top: 2px solid var(--ink);
      border-bottom: 1px solid var(--rule);
    }
    .empty-mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.75rem;
      background-color: var(--ink-3);
      -webkit-mask-image: var(--ramp);
      mask-image: var(--ramp);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }
    .empty-title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 1.15rem;
      line-height: 1.6;
      letter-spacing: -.005em;
      color: var(--ink);
      margin-bottom: .4rem;
    }
    .empty-sub {
      color: var(--ink-3);
      font-family: var(--mono);
      font-size: .74rem;
      letter-spacing: .06em;
    }

    /* ─────────────── End mark ───────────────
       The promise under the masthead is 「讀得完」. This is that promise as a
       glyph: the printer's tombstone, set where the reading actually stops. */
    .endmark {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 1.5rem 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
    }
    .endmark-glyph {
      width: 13px;
      height: 13px;
      background-color: var(--ink-3);
      -webkit-mask-image: var(--ramp);
      mask-image: var(--ramp);
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }
    .endmark-label {
      font-family: var(--mono);
      font-size: .62rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--ink-3);
    }

    /* ─────────────── Footer ─────────────── */
    footer {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 1.5rem;
      align-items: end;
      font-size: .72rem;
      line-height: 1.7;
      color: var(--ink-3);
    }
    .colophon-left { text-align: left; }
    .colophon-center {
      text-align: center;
      color: var(--ink-2);
    }
    .colophon-center em {
      color: var(--accent);
      font-style: normal;
    }
    .colophon-right {
      text-align: right;
      font-family: var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .colophon-right a { color: var(--ink-2); border-bottom: 1px solid var(--rule-2); }
    .colophon-right a:hover { color: var(--accent); border-color: var(--accent); }

    /* ─────────────── 404 ─────────────── */
    .notfound {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 3.5rem 1.5rem 5rem;
      text-align: center;
    }
    /* Spot-illustration scale, not a hero: small and centred in generous space. */
    .notfound-art {
      display: block;
      width: min(190px, 55%);
      height: auto;
      margin: 0 auto 2.25rem;
      border: 1px solid var(--rule);
    }
    .notfound-title {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--ink);
      margin-bottom: .4rem;
    }
    .notfound-sub {
      font-family: var(--mono);
      font-size: .74rem;
      letter-spacing: .06em;
      color: var(--ink-3);
      margin-bottom: 2rem;
    }
    .notfound-back {
      display: inline-block;
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: .5rem 1.1rem;
      transition: color .15s, background .15s;
    }
    .notfound-back:hover { background: var(--accent); color: var(--paper); }

    /* ─────────────── Responsive ───────────────
       A broadsheet collapses to a single column before the columns get narrower
       than the text can survive. Two of these tracks at phone width would be
       roughly twelve Chinese characters per line. */
    @media (max-width: 900px) {
      .cards-grid, .nl-grid { grid-template-columns: 1fr; }
      .cards-grid::before, .nl-grid::before { display: none; }
      .bs-lead-body .yt-body { columns: 1; column-rule: none; }
    }

    @media (max-width: 720px) {
      /* Phones have no hover, so the inset is buying nothing but lost measure at
         this width. Keep a token amount and give the line its characters back. */
      :root { --card-pad: .5rem; }
      .lead-meta { flex-wrap: wrap; gap: .5rem; }
      .lead-author { width: 100%; }
      footer {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .colophon-left, .colophon-right { text-align: center; }

      .bs-art { height: clamp(150px, 22vh, 220px); }
      .bs-plate { margin-top: -2rem; padding: 1.1rem 1rem; }
      .bs-ears { padding: .7rem 1rem; flex-wrap: wrap; gap: .5rem 1.1rem; }
      .bs-ears-rule { display: none; }
      main { padding-left: .9rem; padding-right: .9rem; }
      .endmark, footer, .notfound { padding-left: .9rem; padding-right: .9rem; }
    }

    /* ── Tweet context: quoted / replied-to / top replies ── */
    .ctx-quote {
      margin: .65rem 0;
      padding: .55rem .75rem;
      border-left: 2px solid var(--accent);
      background: var(--tint);
      font-size: .82rem;
      line-height: 1.65;
      color: var(--ink);
      max-width: var(--measure);
    }
    .ctx-quote.ctx-reply {
      border-left-color: var(--rule-2);
      background: var(--paper-2);
    }
    .ctx-label {
      display: block;
      font-family: var(--mono);
      font-size: .62rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: .25rem;
    }
    .ctx-quote p { margin: 0; }

    .ctx-replies {
      margin-top: .5rem;
      font-size: .8rem;
      max-width: var(--measure);
    }
    .ctx-replies > summary {
      cursor: pointer;
      list-style: none;
      color: var(--ink-3);
      padding: .3rem 0;
      user-select: none;
    }
    .ctx-replies > summary::-webkit-details-marker { display: none; }
    .ctx-replies > summary::before {
      content: '▸';
      display: inline-block;
      margin-right: .35rem;
      color: var(--accent);
      transition: transform .15s;
    }
    .ctx-replies[open] > summary::before { transform: rotate(90deg); }
    .ctx-replies ul {
      list-style: none;
      padding: 0;
      margin: .35rem 0 0;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .ctx-replies li {
      padding: .45rem .6rem;
      background: var(--paper-2);
    }
    .ctx-rep-author {
      color: var(--ink);
      font-weight: 500;
      margin-right: .5rem;
    }
    .ctx-rep-likes {
      color: var(--ink-3);
      font-family: var(--mono);
      font-size: .68rem;
    }
    .ctx-replies li p {
      margin: .25rem 0 0;
      color: var(--ink-2);
      line-height: 1.6;
    }

    /* ─────────────── 財經 podcast 重點（最上方，主菜）─────────────── */
    .yt-brief {
      margin: 0 0 3rem;
      padding: 1.75rem 1.75rem 2rem;
      border: 1px solid var(--rule);
      border-top: 3px solid var(--ink);
      background: var(--paper-2);
      position: relative;
    }
    /* 預設收合：summary 為唯一可見、可點開／隨時收合的標題列 */
    .yt-summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      gap: .6rem;
      align-items: flex-start;
    }
    .yt-summary::-webkit-details-marker { display: none; }
    .yt-summary::marker { content: ""; }
    .yt-head { flex: 1; min-width: 0; }
    .yt-toggle {
      flex-shrink: 0;
      margin-top: .1rem;
      color: var(--accent);
      font-size: .9rem;
      line-height: 1.6;
      transition: transform .18s ease;
    }
    details[open] .yt-toggle { transform: rotate(90deg); }
    .yt-expand-hint {
      display: inline-block;
      margin-top: .35rem;
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .06em;
      color: var(--ink-3);
    }
    details[open] .yt-expand-hint { display: none; }
    .yt-summary:hover .yt-toggle,
    .yt-summary:hover .yt-expand-hint { color: var(--accent); }
    .yt-kicker {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: .75rem;
    }
    .yt-title {
      font-family: var(--serif);
      font-size: 1.4rem;
      line-height: 1.4;
      letter-spacing: -.02em;
      margin: 0 0 .75rem;
      font-weight: 600;
      max-width: var(--measure);
    }
    .yt-title a {
      color: var(--ink);
      text-decoration: none;
      transition: color .15s;
    }
    .yt-title a:hover { color: var(--accent); }
    .yt-title a:hover .yt-arrow { transform: translate(2px, -2px); display: inline-block; }
    .yt-arrow { color: var(--ink-3); font-size: .85em; transition: transform .15s; }

    .yt-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem .9rem;
      margin-bottom: 0;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--ink-3);
    }
    .yt-meta .chip.yt-source {
      margin-left: 0;
    }

    .yt-body {
      color: var(--ink);
      line-height: 1.8;
      margin-top: 1.5rem;
      max-width: var(--measure);
    }
    .yt-body h3 {
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--ink);
      margin: 1.75rem 0 .6rem;
      padding-bottom: .35rem;
      border-bottom: 1px solid var(--rule);
    }
    .yt-body h3:first-child { margin-top: 0; }
    .yt-body h4 {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin: 1.25rem 0 .4rem;
      font-weight: 500;
    }
    .yt-body p { margin: .55rem 0; color: var(--ink-2); }
    .yt-body ul { margin: .55rem 0 .9rem; padding-left: 1.3rem; }
    .yt-body li { margin: .3rem 0; color: var(--ink-2); line-height: 1.7; }
    .yt-body strong { color: var(--ink); font-weight: 600; }
    /* 明體沒有真正的斜體，瀏覽器只能把筆畫傾斜，出來是歪掉的字不是強調
       （DESIGN.md 規則 3）。摘要末尾那行固定註記靠字級與顏色退到背景就夠。 */
    .yt-body em { font-style: normal; }
    .yt-body .yt-rule {
      border: none;
      border-top: 1px solid var(--rule-2);
      margin: 1.5rem 0;
    }
    .yt-body .yt-rule + p { font-size: .8rem; color: var(--ink-3); }

    .yt-foot {
      margin-top: 1.5rem;
      font-family: var(--mono);
      font-size: .72rem;
    }
    .yt-foot a {
      color: var(--accent);
      text-decoration: none;
      letter-spacing: .04em;
    }
    .yt-foot a:hover { text-decoration: underline; }

    /* 手機版收窄卡片的左右留白（須放在 .yt-brief 定義之後才不會被蓋掉） */
    @media (max-width: 720px) {
      .yt-brief { padding: 1.1rem 1rem 1.2rem; }
    }

    /* ─────────────── Newsletter / 好文 ───────────────
       卡片本體直接用上面財經重點那組 .yt-* class，這裡只放兩種東西：
       (1) .nl-item — 把頭條規格降成列表規格的少數覆寫
       (2) 財經重點沒有的欄位（頭像、handle、導言）
       請不要在這裡重建一套卡片樣式；要調外觀就去改 .yt-brief。 */
    .nl-divider { margin-top: 3.5rem; }
    .nl-divider span { color: var(--accent); }

    .nl-grid {
      margin-bottom: 3rem;
      border-top: 1px solid var(--rule);
    }

    /* 列表規格：拿掉主菜的框與底色，標題小一級，卡片收成一條一條的列 */
    .nl-item {
      margin: 0;
      padding: 1.5rem var(--card-pad) 1.6rem;
      background: none;
      border: none;
      border-bottom: 1px solid var(--rule);
    }
    .nl-item .yt-title { font-size: 1.15rem; margin-bottom: .6rem; }
    .nl-item .yt-kicker { margin-bottom: .55rem; }
    .nl-item .yt-body { margin-top: 1.25rem; }
    /* 在 desk 上這張卡跟推文卡並排，行首的三角形會把整張卡的左緣往右推 23px，
       兩種卡片的第一個字就對不齊了。改掛右上角——推文卡的 ↗ 也在那個位置，
       一格裡只有一種「右上角有東西可以按」。 */
    .nl-item .yt-summary { position: relative; gap: 0; }
    .nl-item .yt-toggle {
      position: absolute;
      top: .1rem;
      right: 0;
      margin-top: 0;
    }

    /* 財經重點沒有的欄位 */
    .nl-avatar {
      flex: none;
      width: 20px; height: 20px;
      display: inline-grid; place-items: center;
      font-family: var(--mono);
      font-size: .62rem; font-weight: 500;
      color: var(--paper);
      background: var(--accent);
      margin-right: -.45rem;
    }
    .nl-verified { color: var(--accent); font-size: .68rem; margin-left: .25rem; }
    .nl-handle { font-family: var(--mono); }
    /* 導言字級對齊 .yt-body，讓收合與展開讀起來是同一個尺度。
       截三行：文章筆記的第一段是整段重點（兩百多字），照登會讓一張收合的卡片
       比展開的鄰居還高，一排卡片的高度就沒有節奏可言。 */
    .nl-lead {
      margin-top: .7rem;
      line-height: 1.75;
      color: var(--ink-2);
      max-width: var(--measure);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* 展開後全文的第一段就是導言本身，一字不差地連著印兩次。 */
    details[open] .nl-lead { display: none; }

  </style>
</head>
<body>
<header class="bs-head">
  <img class="bs-art" src="assets/masthead-engraving.webp"
       width="836" height="209" alt="" aria-hidden="true" decoding="async" />
  <div class="bs-plate">
    <h1 class="bs-name">晨刊</h1>
    <div class="bs-plate-meta">
      <span>MATINS</span>
    </div>
  </div>
</header>

<main>
  <section class="notfound">
    <img class="notfound-art" src="assets/notfound.webp" width="512" height="768"
         alt="" aria-hidden="true" decoding="async" />
    <p class="notfound-title">這一頁不存在。</p>
    <p class="notfound-sub">可能是網址打錯了，或這一期從來沒有出刊。</p>
    <a class="notfound-back" href="./">回到今天的早報</a>
  </section>
</main>

<div class="endmark">
  <span class="endmark-glyph" aria-hidden="true"></span>
  <span class="endmark-label">本期完</span>
</div>
<script>
  (function() {
    document.querySelectorAll('dialog').forEach(function(d) {
      d.addEventListener('click', function(e) { if (e.target === d) d.close(); });
    });
    // Light is canon: an unset data-theme means light, not dark.
    var icon = document.querySelector('.theme-icon');
    if (icon) icon.textContent = document.documentElement.dataset.theme === 'dark' ? '☾' : '☀';

    var railToggle = document.querySelector('.rail-toggle');
    var railDrawer = document.querySelector('.rail-drawer-toggle');
    var railBackdrop = document.querySelector('.rail-backdrop');
    var mobileMQ = window.matchMedia('(max-width: 980px)');

    function closeDrawer() {
      document.body.classList.remove('rail-drawer-open');
      if (railDrawer) railDrawer.setAttribute('aria-expanded', 'false');
    }
    function openDrawer() {
      document.body.classList.add('rail-drawer-open');
      if (railDrawer) railDrawer.setAttribute('aria-expanded', 'true');
    }

    if (railToggle) {
      var collapsed = document.documentElement.dataset.rail === 'collapsed';
      railToggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      railToggle.setAttribute('aria-label', collapsed ? '展開側欄' : '收合側欄');
      railToggle.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (mobileMQ.matches) {
          closeDrawer();
          return;
        }
        var next = document.documentElement.dataset.rail !== 'collapsed';
        if (next) document.documentElement.dataset.rail = 'collapsed';
        else delete document.documentElement.dataset.rail;
        try { localStorage.setItem('rail-collapsed', next ? '1' : '0'); } catch (err) {}
        railToggle.setAttribute('aria-expanded', next ? 'false' : 'true');
        railToggle.setAttribute('aria-label', next ? '展開側欄' : '收合側欄');
      });
    }

    if (railDrawer) {
      railDrawer.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (document.body.classList.contains('rail-drawer-open')) closeDrawer();
        else openDrawer();
      });
    }
    if (railBackdrop) {
      railBackdrop.addEventListener('click', closeDrawer);
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.body.classList.contains('rail-drawer-open')) {
        closeDrawer();
      }
    });
    // Close drawer when navigating to an archive item (visual feedback before nav).
    document.addEventListener('click', function(e) {
      if (e.target.closest('.rail-item')) closeDrawer();
    });
    // If viewport grows past mobile breakpoint, drop transient drawer state.
    mobileMQ.addEventListener('change', function(ev) {
      if (!ev.matches) closeDrawer();
    });
  })();
  function toggleTheme() {
    var cur = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    var next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    document.querySelectorAll('.theme-icon').forEach(function(el) {
      el.textContent = next === 'dark' ? '☾' : '☀';
    });
  }
</script>
</body>
</html>
